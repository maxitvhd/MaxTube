[package]
name = "maxtube"
version = "0.1.0"
description = "Gerencia titulos do YouTube com sugestoes de IA local (Ollama)"
authors = ["maxitvhd"]
edition = "2021"

[lib]
name = "maxtube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
toml = "0.8"
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
