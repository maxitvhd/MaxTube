[package]
name = "maxtube"
version = "0.1.0"
edition = "2021"
description = "Gerencia titulos do YouTube com sugestoes geradas por IA local (Ollama)"
license = "MIT"

[[bin]]
name = "maxtube"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
urlencoding = "2"
